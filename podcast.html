    </style>

  <body>
    <header class="site-head">
      <a class="brand" href="./" aria-label="回到 BÐ-Studio 首頁"><img src="assets/bd-original-hammer-logo-transparent.png" alt="BÐ-Studio b／D 交叉鐵鎚標誌" />BÐ-STUDIO</a>

        <article class="podcast-card">
          <div class="cover" aria-label="比爸說播客 BÐ Tell 封面"><img src="assets/bd-original-hammer-logo-transparent.png" alt="BÐ Tell 節目標誌" /><b>Tell</b></div>
          <div>

            <div class="action-row">

          </div>
        </article>
      </section>
    </main>
    <footer class="site-foot">© 2026 BÐ-STUDIO · ALL SIGNALS RESERVED.</footer>
    <script>
      const moreButton = document.querySelector('#more-button');
      const description = document.querySelector('#episode-description');
      moreButton.addEventListener('click', () => {
        const isOpen = moreButton.getAttribute('aria-expanded') === 'true';
        moreButton.setAttribute('aria-expanded', String(!isOpen));
        moreButton.textContent = isOpen ? '顯示更多 ↗' : '收起內容 ↑';
        description.classList.toggle('visible', !isOpen);
      });
    </script>
